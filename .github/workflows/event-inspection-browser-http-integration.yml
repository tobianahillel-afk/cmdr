name: Event Search to Event Inspection live local HTTP integration

on:
  pull_request:
    paths:
      - "product-runtime/event-search-frontend/**"
      - "product-runtime/event-inspection-host/testdata/fixture/**"
      - "work/lots/E10-INV-004H-HTTPBRIDGE/**"
      - ".github/workflows/event-inspection-browser-http-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-to-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert true source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up pinned Go host toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: product-runtime/event-inspection-host/go.mod
          cache: false
      - name: Set up first-party browser Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
      - name: Validate browser code and transport syntax
        working-directory: product-runtime/event-search-frontend
        run: |
          node --check inspection.mjs
          node --check inspection-http.mjs
          node --check inspection-http.test.mjs
      - name: Exercise full frontend suite across real Go loopback HTTP
        working-directory: product-runtime/event-search-frontend
        run: npm test
      - name: Vet and race-check host without production provider
        working-directory: product-runtime/event-inspection-host
        run: |
          go vet ./...
          go test -race -count=1 ./...
