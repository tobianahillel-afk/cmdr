name: engineering-kernel-full

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: engineering-kernel-full-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/cmdr-dev/go.mod
          cache: false

      - name: Enforce gofmt
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          diff="$(gofmt -d .)"
          if [ -n "$diff" ]; then
            printf 'gofmt diff:\n%s\n' "$diff"
            exit 1
          fi

      - name: Vet kernel
        working-directory: tools/cmdr-dev
        run: go vet ./...

      - name: Test kernel
        working-directory: tools/cmdr-dev
        run: go test ./...

      - name: Compile canonical product spec inventory
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          output="$ci_tmp/spec-index.json"
          go run . spec-index --root ../.. --output "$output" --json
          test -s "$output"

      - name: Verify canonical product spec baseline
        working-directory: tools/cmdr-dev
        run: go run . spec-baseline --root ../.. --check --json

      - name: Build canonical product entity graph
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          output="$ci_tmp/coverage-graph.json"
          go run . coverage-graph --root ../.. --output "$output" --json
          test -s "$output"

      - name: Derive active implementation obligations
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          output="$ci_tmp/obligations.json"
          go run . obligations --root ../.. --output "$output" --json
          test -s "$output"

      - name: Audit product coverage gaps
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          output="$ci_tmp/coverage-audit.json"
          go run . coverage-audit --root ../.. --output "$output" --json
          test -s "$output"

      - name: Validate work manifests
        working-directory: tools/cmdr-dev
        run: go run . validate-manifests --root ../.. --json

      - name: Validate check catalog
        working-directory: tools/cmdr-dev
        run: go run . check-catalog-audit --root ../.. --json

      - name: Validate impact analysis engine
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          changes="$ci_tmp/impact-changes.txt"
          printf '%s\n' 'engineering/testing/check-catalog.json' 'work/graph.json' > "$changes"
          go run . impact --root ../.. --changes-file "$changes" --json

      - name: Validate risk-adaptive plan
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          changes="$ci_tmp/plan-changes.txt"
          printf '%s\n' 'engineering/testing/check-catalog.json' 'work/graph.json' > "$changes"
          go run . validation-plan --root ../.. --changes-file "$changes" --json

      - name: Audit architecture path ownership
        working-directory: tools/cmdr-dev
        run: go run . architecture-audit --root ../.. --json

      - name: Audit product runtime dependencies
        working-directory: tools/cmdr-dev
        run: go run . dependency-audit --root ../.. --json

      - name: Audit cross-boundary dependencies
        working-directory: tools/cmdr-dev
        run: go run . boundary-edge-audit --root ../.. --json

      - name: Audit work-unit complexity
        working-directory: tools/cmdr-dev
        run: go run . complexity-audit --root ../.. --json

      - name: Compile active agent context
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_tmp"
          trap 'rm -rf "$ci_tmp"' EXIT
          output="$ci_tmp/context.json"
          active_work_unit="$(jq -r '.execution.active_work_unit // empty' ../../engineering/state/current.json 2>/dev/null || true)"
          if [ -n "$active_work_unit" ]; then
            go run . context --root ../.. --output "$output" --json
            test -s "$output"
          else
            go run . context --root ../.. --output "$output" --json
            echo "Verified context compiler execution with empty active work unit"
          fi

      - name: Bootstrap doctor
        working-directory: tools/cmdr-dev
        run: go run . doctor --root ../..

      - name: Resolve next work
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          set +e
          output="$(go run . next --root ../.. --json 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            printf '%s\n' "$output"
          elif echo "$output" | grep -Fq "no executable READY work unit"; then
            echo "Work graph verified: 0 executable READY work units (valid quiescent state)"
          else
            printf 'Error resolving next work unit:\n%s\n' "$output" >&2
            exit $status
          fi
