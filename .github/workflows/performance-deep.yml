name: performance-deep

on:
  schedule:
    - cron: "43 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      stage:
        description: "Deep performance stage"
        required: true
        default: "on-demand"
        type: choice
        options:
          - nightly
          - on-demand
          - release
      requested_target:
        description: "Optional exact PERF-DEEP-* target for on-demand execution"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-deep-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deep-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/cmdr-dev/go.mod
          cache: false

      - name: Run bounded deep performance validation
        working-directory: tools/cmdr-dev
        shell: bash
        env:
          CMDR_INPUT_STAGE: ${{ inputs.stage }}
          CMDR_REQUESTED_TARGET: ${{ inputs.requested_target }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) stage="nightly" ;;
            release) stage="release" ;;
            workflow_dispatch) stage="$CMDR_INPUT_STAGE" ;;
            *) echo "unsupported event $GITHUB_EVENT_NAME" >&2; exit 2 ;;
          esac
          kernel="$GITHUB_WORKSPACE/.cmdr-dev-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$kernel"' EXIT
          go build -o "$kernel" .
          args=(deep-performance-audit --root ../.. --stage "$stage" --json)
          if [[ -n "$CMDR_REQUESTED_TARGET" ]]; then
            args+=(--requested-performance-target "$CMDR_REQUESTED_TARGET")
          fi
          "$kernel" "${args[@]}"
