name: investigation-timeline-runtime

on:
  pull_request:
    paths:
      - "product-runtime/investigation-timeline/**"
      - "tools/cmdr-dev/security_tests.go"
      - ".github/workflows/investigation-timeline-runtime.yml"
  push:
    branches:
      - "engineering/autonomous-development-foundation"
    paths:
      - "product-runtime/investigation-timeline/**"
      - "tools/cmdr-dev/security_tests.go"
      - ".github/workflows/investigation-timeline-runtime.yml"

permissions:
  contents: read

concurrency:
  group: investigation-timeline-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: product-runtime/investigation-timeline/go.mod
          cache: false
      - name: Verify Timeline projection module
        shell: bash
        run: |
          set -euo pipefail
          (cd product-runtime/investigation-timeline && go test -count=1 -race ./...)
          (cd product-runtime/investigation-timeline && go test -count=1 -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/.timeline-coverage" ./...)
          (cd product-runtime/investigation-timeline && go vet ./...)
          (cd product-runtime/investigation-timeline && go tool cover -func="$GITHUB_WORKSPACE/.timeline-coverage")
          echo "::group::Go formatting"
          gofmt -d product-runtime/investigation-timeline/*.go
          files="$(gofmt -l product-runtime/investigation-timeline/*.go)"
          if [ -n "$files" ]; then
            echo "Unformatted Timeline files: $files" >&2
            exit 1
          fi
          echo "::endgroup::"
