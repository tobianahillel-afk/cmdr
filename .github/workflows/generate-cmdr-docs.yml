name: Generate canonical CMDR documentation

on:
  push:
    branches:
      - docs/cmdr-product-spec-foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/cmdr-product-spec-foundation
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate and validate canonical tree
        run: python3 tools/generate_cmdr_docs.py
