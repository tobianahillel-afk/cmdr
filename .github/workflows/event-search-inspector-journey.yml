name: Investigate Event Search to Inspection journey

on:
  pull_request:
    paths:
      - "product-runtime/event-search-frontend/**"
      - "work/lots/E10-INV-004F-JOURNEY/**"
      - ".github/workflows/event-search-inspector-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-inspection-journey:
    name: event-search-inspection-node24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product-runtime/event-search-frontend
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact feature HEAD
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
      - name: Validate first-party modules
        run: |
          node --check inspection.mjs
          node --check inspection.test.mjs
      - name: Exercise Event Search and Inspector full frontend regression suite
        run: npm test
