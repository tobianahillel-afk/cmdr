name: case-queue-closure

on:
  push:
    branches:
      - "engineering/autonomous-development-foundation"
    paths:
      - "product-runtime/case-queue/**"
      - "engineering/performance/**"
      - "work/lots/E10-INV-101E-CLOSURE/**"
      - "tools/cmdr-dev/performance_case_queue.go"
      - ".github/workflows/case-queue-closure.yml"

permissions:
  contents: read

concurrency:
  group: case-queue-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measured-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/cmdr-dev/go.mod
          cache: false
      - name: Validate bounded Case Queue runtime and probe
        shell: bash
        run: |
          (cd product-runtime/case-queue && go test -race ./... && go vet ./...)
          diff="$(gofmt -d product-runtime/case-queue/cmd/perf-probe)"
          if [ -n "$diff" ]; then
            printf '%s\\n' "$diff"
            exit 1
          fi
      - name: Measure local latency and deep resources
        working-directory: tools/cmdr-dev
        shell: bash
        run: |
          go build -o "$GITHUB_WORKSPACE/.cmdr-case-queue-closure" .
          binary="$GITHUB_WORKSPACE/.cmdr-case-queue-closure"
          trap 'rm -f "$binary"' EXIT
          printf 'product-runtime/case-queue/handoff.go\\n' > "$GITHUB_WORKSPACE/.cmdr-case-queue-changes"
          "$binary" performance-benchmark-audit --root ../.. --stage pr --changes-file "$GITHUB_WORKSPACE/.cmdr-case-queue-changes" --json
          for target in PERF-DEEP-CASE-QUEUE-PROJECTION PERF-DEEP-CASE-QUEUE-SAVED-VIEW PERF-DEEP-CASE-QUEUE-HANDOFF; do
            "$binary" deep-performance-audit --root ../.. --stage on-demand --requested-performance-target "$target" --json
          done
